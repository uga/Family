# Publishing a release.
#
# Runs when a tag beginning with "v" is pushed, and nothing else - not on every commit, and
# not on a merge. Cutting a release is a decision somebody takes, and pushing a tag is how
# they take it (tools/release.sh does the taking).
#
# Three clients, one zip. The packager reads ## Interface from the .toc, which already names
# all three, so CurseForge is told this build is for Era, Burning Crusade and Mists rather
# than being asked to guess.

name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  package:
    runs-on: ubuntu-latest

    # The packager does two things with one tag: it uploads the zip to CurseForge, and it
    # creates the GitHub release that the tag points at. The second needs write access to
    # the repository's contents, and GITHUB_TOKEN is read-only unless a job asks otherwise.
    #
    # Asking here rather than raising the repository-wide default keeps every other workflow
    # read-only, and keeps the reason in the file that needs it. Without this the upload
    # succeeds and the release step returns 403 - a half-published version, which is the
    # worst of the three outcomes.
    permissions:
      contents: write

    steps:
      - name: Check out, with the whole history
        # v7 rather than v4: see the note in checks.yml. Neither workflow is triggered by
        # pull_request_target or workflow_run, which is the one thing v7 restricts.
        uses: actions/checkout@v7
        with:
          # The packager builds a changelog from the commits since the previous tag, and a
          # shallow clone has no previous tag to look back to.
          fetch-depth: 0

      - name: Run the checks before publishing anything
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1
          lua5.1 tests/Harness.lua

      - name: Package and upload
        uses: BigWigsMods/packager@master
        env:
          # Set these once, in the repository's Settings -> Secrets and variables ->
          # Actions. docs/RELEASING.md says where each one comes from.
          #
          # Any that is absent simply means that destination is skipped, so a release can
          # go to CurseForge alone until somebody wants the others.
          CF_API_KEY: ${{ secrets.CF_API_KEY }}
          WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
          WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}
          GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}

      - name: Look inside the zip that was just built
        # The libraries are .pkgmeta externals, and a .toc silently skips a file it cannot
        # find - so a wrong destination produces a zip that installs cleanly and loads none
        # of them. Five releases went out that way before a player on a fresh machine found
        # it (docs/LESSONS.md L-038).
        #
        # The harness compares .pkgmeta against the .toc, which catches that mismatch in the
        # repository. This catches whatever the packager actually produced, which is the
        # thing players install and the thing nothing had ever opened.
        #
        # It runs after the upload, because the action does both in one step. A red run here
        # does not unpublish anything; it says, loudly and immediately, that the version just
        # published needs another one behind it.
        run: |
          python3 - <<'PY'
          import glob, sys, zipfile

          builds = [z for z in glob.glob(".release/*.zip") if "nolib" not in z]
          if not builds:
              sys.exit("no zip was built - there is nothing to look inside")

          missing = []
          for build in builds:
              names = set(zipfile.ZipFile(build).namelist())
              for toc in ("addons/Family/Family.toc", "addons/Family_UI/Family_UI.toc"):
                  folder = toc.split("/")[1]
                  for line in open(toc, encoding="utf-8"):
                      line = line.strip()
                      if line.startswith("Libs\\"):
                          wanted = folder + "/" + line.replace("\\", "/")
                          if wanted not in names:
                              missing.append(build + ": " + wanted)

          if missing:
              sys.exit("the zip is missing libraries the toc loads: " + ", ".join(missing))

          print("every library the toc loads is in the zip, where the toc looks for it")
          PY
