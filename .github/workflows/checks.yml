# The checks, on every commit.
#
# Separate from release.yml on purpose, and it must stay separate. That workflow packages
# and uploads, and it runs on a tag because pushing a tag is the act of publishing. Adding
# branches to its trigger would publish on every commit instead - which is the one thing
# the release script is written to prevent.
#
# So this file runs the harness and nothing else. A red run here costs nothing but tells
# you on the day, rather than at release, which is the whole point: release.yml checks the
# same thing again before it uploads, and by then a break is weeks old.

name: Checks

on:
  push:
    branches:
      - "**"
  pull_request:

jobs:
  harness:
    runs-on: ubuntu-latest

    steps:
      # v4 targets Node 20, which GitHub has deprecated: the runner forces those actions onto
      # Node 24 and warns on every run. v5 is the release that moved to Node 24 on purpose and
      # v7 is the current major, so the annotation goes away rather than being tolerated until
      # the forcing stops being free.
      - uses: actions/checkout@v7

      - name: Install Lua
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq lua5.1

      - name: Run the harness
        run: lua5.1 tests/Harness.lua .
